version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Retail Sales Analytics Pipeline — Docker Compose
# Services: Spark master, Spark worker ×2, Oracle XE 21c, MySQL 8.4
# NOTE: Spark is used for distributed mode (Phases 3–5 normally run local[*]).
#       Oracle XE image: gvenzl/oracle-xe:21-slim-faststart (no Oracle login needed).
# ─────────────────────────────────────────────────────────────────────────────

networks:
  retail-net:
    driver: bridge

volumes:
  oracle-data:
    driver: local
  mysql-data:
    driver: local

services:

  # ── Spark Master ────────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    user: root
    command: >
      bash -c "
        /opt/spark/sbin/start-master.sh &&
        tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master*.out
      "
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    volumes:
      - ./src:/opt/spark-app/src
      - ./data:/opt/spark-app/data
      - ./config:/opt/spark-app/config
      - ./jars:/opt/spark-app/jars
    networks:
      - retail-net

  # ── Spark Worker 1 ──────────────────────────────────────────────────────────
  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    user: root
    command: >
      bash -c "
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 3g &&
        tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out
      "
    ports:
      - "8081:8081"   # Worker Web UI
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark-app/src
      - ./data:/opt/spark-app/data
      - ./config:/opt/spark-app/config
      - ./jars:/opt/spark-app/jars
    networks:
      - retail-net

  # ── Spark Worker 2 ──────────────────────────────────────────────────────────
  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    user: root
    command: >
      bash -c "
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 3g &&
        tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out
      "
    ports:
      - "8082:8081"   # Worker Web UI (mapped to host 8082)
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark-app/src
      - ./data:/opt/spark-app/data
      - ./config:/opt/spark-app/config
      - ./jars:/opt/spark-app/jars
    networks:
      - retail-net

  # ── Oracle XE 21c ───────────────────────────────────────────────────────────
  # gvenzl/oracle-xe requires NO Oracle account login — available on Docker Hub.
  # APP_USER / APP_USER_PASSWORD create a non-DBA user automatically.
  # First boot can take 3–5 minutes to initialize the database.
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: oracle-xe
    hostname: oracle-xe
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      APP_USER: ${ORACLE_USER}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD}
    ports:
      - "1521:1521"   # SQL*Net listener
      - "5500:5500"   # Oracle EM Express (optional)
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - retail-net
    healthcheck:
      # healthcheck.sh is bundled in gvenzl image
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 180s

  # ── MySQL 8.0 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql-retail
    hostname: mysql-retail
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - retail-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
